name: Update YouTube videos

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_videos.py, .github/workflows/videos.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_videos.py
      - name: Commit videos.json if it changed
        run: |
          git add videos.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update YouTube videos"
          git push
